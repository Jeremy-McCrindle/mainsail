# Fork: weekly update pull requests go to `dev` and wait for the owner's review (FORK.md).
# Security-fix pull requests target the default branch, which is also `dev`.

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    assignees:
      - 'Jeremy-McCrindle'
    schedule:
      # Check for updates to GitHub Actions every week
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    allow:
      # Ignore major updates to all dependencies. We're using old versions of some packages that are incompatible with newer versions of other packages.
      - dependency-name: '*'
        update-type: 'semver:non-major'
        dependency-type: 'direct'
    assignees:
      - 'Jeremy-McCrindle'
