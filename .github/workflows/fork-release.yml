# Fork release: every push to main (a merged staging -> main pull request) becomes a release
# v<upstream version>-fork.<n>, with mainsail.zip and its SHA-256. jerrypi's updater
# (production channel) deploys the release GitHub marks as latest, once the printer is idle.
# To roll jerrypi back, mark an older release as latest.
name: Fork release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Choose the version
        id: version
        run: |
          existing=$(git tag --points-at HEAD --list 'v*-fork.*' | head -1)
          if [[ -n "$existing" ]]; then
            echo "::notice::$GITHUB_SHA is already released as $existing; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(node -p "require('./package.json').version")
          last=$(git tag --list "v${base}-fork.*" | sed "s/^v${base}-fork\.//" | sort -n | tail -1)
          version="${base}-fork.$(( ${last:-0} + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.version.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm version --no-git-tag-version "$VERSION"
          npm run build
          mv dist/mainsail.zip mainsail.zip
          sha256sum mainsail.zip > mainsail.zip.sha256

      - name: Publish the release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" mainsail.zip mainsail.zip.sha256 \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --latest
